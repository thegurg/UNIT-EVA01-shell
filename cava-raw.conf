# cava raw output for the quickshell visualizer strip: 24 bars, 30fps,
# ascii levels 0-7 (";" separated, newline per frame).
[general]
framerate = 30
bars = 24

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10

[input]
method = pulse
